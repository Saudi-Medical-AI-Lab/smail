<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/normalize.css" />
    <link rel="stylesheet" href="./CSS/styles.css" />
    <link rel="icon" href="./images/SMAIL Icon Colored.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/x-icon" href="./images/SMAIL Icon Colored.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <title>SMAIL | News</title>
    <meta name="description" content="Program milestones, publications, and announcements from the Saudi Medical AI Lab (SMAIL).">
    <meta name="keywords" content="SMAIL news, Saudi Medical AI Lab updates, medical AI Saudi Arabia announcements">
    <link rel="canonical" href="https://smail.org.sa/news.html">
    <meta property="og:title" content="SMAIL | News">
    <meta property="og:description" content="Program milestones, publications, and announcements from SMAIL.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://smail.org.sa/news.html">
    <meta property="og:image" content="https://smail.org.sa/images/Riyadhero-fallback.jpg">
    <meta property="og:site_name" content="SMAIL">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SMAIL | News">
    <meta name="twitter:description" content="Program milestones, publications, and announcements from SMAIL.">
    <meta name="twitter:image" content="https://smail.org.sa/images/Riyadhero-fallback.jpg">
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar" style="z-index: 999;">
      <div class="container">
        <a class="navbar-brand pt-1" href="/">
          <img src="./images/SMAIL Updated.svg" width="120" alt="SMAIL Logo" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <button class="close-navbar" aria-label="Close menu">&times;</button>
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="/" data-i18n="nav_home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/#about" data-i18n="nav_about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="/#program" data-i18n="nav_program">Program</a></li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="nav_community">Community</a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="students.html" data-i18n="nav_students">Students</a></li>
                <li><a class="dropdown-item" href="mentors.html" data-i18n="nav_mentors">Mentors</a></li>
                <li><a class="dropdown-item" href="staff.html" data-i18n="nav_staff">Staff</a></li>
                <li><a class="dropdown-item" href="board.html" data-i18n="nav_board">Board</a></li>
              </ul>
            </li>
            <li class="nav-item"><a class="nav-link" href="papers.html" data-i18n="nav_publications">Publications</a></li>
            <li class="nav-item"><a class="nav-link active" href="news.html" data-i18n="nav_news">News</a></li>
            <li class="nav-item"><a class="nav-link" href="FAQ.html" data-i18n="nav_faq">FAQ</a></li>
          </ul>
          <a href="https://www.sdaia.gov.sa/" target="_blank"><img src="./images/sdaia2.svg" width="100" alt="SDAIA Logo" /></a>
          <a href="https://www.sdaia.gov.sa/" target="_blank"><img src="./images/ai-year.svg" width="100" alt="AI Year Logo" /></a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="page-wrapper">
      <section class="section-white news-hero">
        <div class="container text-center">
          <span class="section-badge" data-i18n="news_badge">NEWS &amp; UPDATES</span>
          <h1 class="section-heading" data-i18n="news_heading">Latest from <span class="accent-red">SMAIL</span></h1>
          <p class="section-description mx-auto" data-i18n="news_desc">Program milestones, publications, and announcements from the lab.</p>
        </div>
      </section>

      <section class="section-light-pink news-body">
        <div class="container">

          <!-- Featured story -->
          <div data-news="featured"></div>

          <!-- Grid of stories -->
          <div class="news-grid" data-news="grid"></div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="./JS/i18n.js"></script>
    <script src="./JS/navbarScript.js"></script>
    <script src="./JS/content.js"></script>

    <script>
      AOS.init();
      fetch('footer.html')
        .then(r => r.text())
        .then(data => { document.getElementById('footer-placeholder').innerHTML = data; })
        .catch(e => console.error('Error loading footer:', e));
    </script>
  </body>
</html>
